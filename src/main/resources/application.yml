server:
  port: 8080
  tomcat:
    threads:
      max: 10                    # Reducir hilos (default 200)
      min-spare: 2
    accept-count: 5
    connection-timeout: 20000

spring:
  datasource:   
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2       # Reducir conexiones BD (default 10)
      minimum-idle: 1
      idle-timeout: 60000        # 1 minuto
      connection-timeout: 30000
      max-lifetime: 300000
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false        # ← Cambiado: false para ahorrar CPU
        jdbc.batch_size: 5       # ← Nuevo: procesar en lote
        order_inserts: true      # ← Nuevo
        order_updates: true      # ← Nuevo
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
      cache:
        period: 86400            # ← Nuevo: cachear recursos estáticos 24h

  logging:
    level:
      com.codex.finance: WARN   # ← Cambiado: solo warnings de tu app
      org.springframework: WARN  # ← Cambiado: reducir logs
      org.hibernate: WARN        # ← Cambiado: reducir logs

app:
  url: https://kqzjbstrhutdgrqcqfow.supabase.co
  anon-key: ${APP_ANON_KEY}
  jwk-set-uri: https://kqzjbstrhutdgrqcqfow.supabase.co/auth/v1/.well-known/jwks.json

supabase:
  url: https://kqzjbstrhutdgrqcqfow.supabase.co
  anon-key: ${SUPABASE_ANON_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  jwk-set-uri: https://kqzjbstrhutdgrqcqfow.supabase.co/auth/v1/.well-known/jwks.json